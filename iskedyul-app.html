<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iskedyul ng Pulong sa Gitnang Sanlinggo</title>
<style>
  :root {
    --maroon: #8B0D14;
    --dark-red: #7A0C10;
    --olive: #A88B00;
    --ink: #1a1a1a;
    --paper: #ffffff;
    --purple: #6a1b9a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    background: #f2f0ec;
    color: var(--ink);
    padding: 16px;
  }

  .sheet {
    max-width: 860px;
    margin: 0 auto;
    background: var(--paper);
    box-shadow: 0 2px 14px rgba(0,0,0,.18);
    padding: 26px 34px 40px;
  }

  /* ---------- Masthead ---------- */
  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 3px solid var(--ink);
    padding-bottom: 6px;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 4px;
  }
  .masthead .congregation { font-weight: 700; font-size: 14px; }
  .masthead h1 { font-size: 26px; font-weight: 800; letter-spacing: .3px; text-align: center; flex: 1; }

  /* ---------- Title / officers ---------- */
  .meeting-title { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
  .officers {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    font-size: 13px;
  }
  .officers .label { font-weight: 600; color: #444; margin-right: 6px; }
  .officers .name { font-weight: 700; }

  /* ---------- Sections ---------- */
  .section-bar {
    display: inline-block;
    color: #fff;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: .6px;
    text-transform: uppercase;
    padding: 4px 12px;
    margin: 14px 0 6px;
  }
  .section-maroon { background: var(--dark-red); }
  .section-olive  { background: var(--olive); }

  table.schedule { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.schedule td { vertical-align: top; padding: 4px 6px; }
  td.time { width: 46px; color: #333; font-size: 12.5px; padding-top: 6px; white-space: nowrap; }
  td.item { width: 62%; }
  td.assign { width: 38%; text-align: left; padding-left: 12px; }
  .item-text { font-weight: 600; }
  .duration { font-weight: 600; }
  .song::before { content: "◆ "; font-size: 9px; vertical-align: 2px; }
  .assign .hall { font-size: 12px; color: #333; margin-bottom: 2px; }
  .assign .names { font-weight: 700; color: var(--purple); }
  .assign .names.plain { color: var(--ink); }

  /* ---------- Toolbar ---------- */
  .toolbar {
    max-width: 860px;
    margin: 0 auto 14px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    font-size: 13px;
  }
  .toolbar input[type=text] {
    flex: 1;
    min-width: 260px;
    padding: 7px 10px;
    border: 1px solid #bbb;
    border-radius: 4px;
    font-size: 13px;
  }
  .toolbar select {
    padding: 7px 10px;
    border: 1px solid #bbb;
    border-radius: 4px;
    font-size: 13px;
    max-width: 240px;
  }
  .toolbar button {
    padding: 7px 16px;
    border: none;
    border-radius: 4px;
    background: var(--maroon);
    color: #fff;
    font-weight: 700;
    cursor: pointer;
  }
  .toolbar button.secondary { background: #666; }
  .status { font-size: 12.5px; color: #555; max-width: 860px; margin: 0 auto 6px; }
  .status.error { color: var(--maroon); font-weight: 700; }

  @media print {
    body { background: #fff; padding: 0; }
    .toolbar, .status { display: none; }
    .sheet { box-shadow: none; max-width: none; }
  }
  @media (max-width: 620px) {
    .sheet { padding: 16px; }
    .masthead h1 { font-size: 19px; }
    td.item { width: 55%; }
    td.assign { width: 45%; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <input type="text" id="sheetUrl" placeholder="Google Sheet link…">
  <select id="weekPicker" onchange="showWeek(this.value)" disabled><option>—</option></select>
  <button onclick="loadSheet()">I-load ang Sheet</button>
  <button class="secondary" onclick="print()">I-print</button>
</div>
<div class="status" id="status">Kumukuha ng data mula sa Google Sheet…</div>

<div class="sheet" id="output">
  <p style="text-align:center;color:#777;padding:40px 0;">Naglo-load…</p>
</div>

<script>
/* =========================================================
   Iskedyul app — pulls the congregation meeting schedule
   straight from a published Google Sheet and renders it as
   a weekly bulletin, matching the reference layout.
   ========================================================= */

const DEFAULT_SHEET = "https://docs.google.com/spreadsheets/d/1NTE-fXdxATWEH8if_8eEbXhrLRjprKA_oDDNoFLHHlA/edit?gid=0#gid=0";
const CONGREGATION = "Bacungan Cong";
const STORAGE_KEY = "iskedyul.sheetUrl";

const MONTHS = { jan:0, feb:1, mar:2, apr:3, may:4, jun:5, jul:6, aug:7, sep:8, oct:9, nov:10, dec:11 };
const SECTION_NAMES = [
  null,
  "KAYAMANAN MULA SA SALITA NG DIYOS",
  "MAGING MAHUSAY SA MINISTERYO",
  "PAMUMUHAY BILANG KRISTIYANO"
];

/* ---------- Fetch via gviz JSON endpoint (no API key needed) ---------- */
function extractSheetId(input) {
  if (!input) return null;
  const m = input.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  return m ? m[1] : (input.trim().match(/^[a-zA-Z0-9-_]+$/) ? input.trim() : null);
}

async function fetchSheetRows(sheetId) {
  const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status} — siguraduhing "Anyone with the link" ang share setting.`);
  const text = await res.text();
  const json = JSON.parse(text.substring(text.indexOf("(") + 1, text.lastIndexOf(")")));
  return json.table.rows.map(r => (r.c || []).map(c =>
    c && c.f != null && c.f !== "" ? String(c.f) : (c && c.v != null ? String(c.v) : "")
  ));
}

/* ---------- Parse the sheet into meeting blocks ----------
   The sheet stacks several weekly blocks vertically. Each block:
     • row containing "Iskedyul ng Pulong sa Gitnang Sanlinggo"
     • date (col A) · "LINGGUHANG PAGBABASA NG BIBLIYA" (col C) · "Chairman:" (col G) + name (col H)
     • Bible reading e.g. "JEREMIAS 31" (col C) · "Panalangin:" (col F) + name (col H)
     • song rows: bare number in col C
     • part rows: number in col B, title in col C, "(n min.)" in col F, assignees in cols H/I
     • a lone "Main Hall" cell marks hall assignments for the following rows
----------------------------------------------------------- */
function cellTxt(cells, i) { return (cells[i] || "").trim(); }

function parseMeetings(rows) {
  const meetings = [];
  let cur = null;
  let awaitingReading = false;
  let pastParts = false;   // true once we've seen numbered parts (header zone ended)
  let hall = null;

  const newMeeting = () => ({ dateLabel: "", date: null, reading: "",
                              chairman: "", openingPrayer: "", rows: [] });

  for (const cells of rows) {
    const low = cells.map(s => s.trim().toLowerCase());

    if (low.some(s => s === "iskedyul ng pulong sa gitnang sanlinggo")) {
      if (cur && cur.dateLabel) meetings.push(cur);
      cur = newMeeting(); awaitingReading = false; pastParts = false; hall = null;
      continue;
    }
    if (!cur) continue;

    // Date cell, e.g. "September 4" / "Oct 16"
    const dateCell = cells.find(s => /^(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+\d{1,2}$/i.test(s.trim()));
    if (dateCell && !cur.dateLabel) {
      cur.dateLabel = dateCell.trim();
      const [, mon, day] = dateCell.trim().toLowerCase().match(/^([a-z]+)[a-z]*\.?\s+(\d{1,2})$/);
      const y = new Date().getFullYear();
      cur.date = new Date(y, MONTHS[mon.slice(0,3)], +day, 12);
      continue;
    }

    // Chairman / Panalangin labels: value = next non-empty cell to the right
    for (let i = 0; i < low.length; i++) {
      const key = low[i].replace(/:$/, "");
      if (key === "chairman" || key === "panalangin") {
        let val = "";
        for (let j = i + 1; j < cells.length; j++) { if (cells[j].trim()) { val = cells[j].trim(); break; } }
        if (val && val.toLowerCase() !== "main hall") {
          if (key === "chairman" && !cur.chairman) cur.chairman = val;
          else if (key === "panalangin" && !pastParts && !cur.openingPrayer) cur.openingPrayer = val;
        }
      }
    }

    const c = cellTxt(cells, 2);            // col C
    const b = cellTxt(cells, 1);            // col B
    const f = cellTxt(cells, 5);            // col F

    // Bible reading follows the "LINGGUHANG PAGBABASA…" header row
    if (low.some(s => s.includes("lingguhang pagbabasa"))) { awaitingReading = true; continue; }
    if (awaitingReading) {
      if (c && !c.startsWith("(")) cur.reading = c;
      awaitingReading = false;
      continue;
    }

    // Lone "Main Hall" marker → hall for subsequent rows
    const filled = cells.filter(s => s.trim());
    if (filled.length === 1 && filled[0].trim().toLowerCase() === "main hall") { hall = "Main Hall"; continue; }

    // Song row: bare number in col C, nothing else meaningful
    if (!b && /^\d{1,3}$/.test(c)) {
      cur.rows.push({ type: "song", n: c });
      hall = null;
      continue;
    }

    // Part row: item number in col B
    if (b && /^\d{1,2}$/.test(b)) {
      pastParts = true;
      const title = c.replace(/^\.\s*/, "");
      const dur = f.replace(/\bi\b/i, "");
      if (!title || /^\(pamagat\)$/i.test(title) || /^\(x\s*min/i.test(f)) continue; // unfilled placeholder
      const n = parseInt(b, 10);
      cur.rows.push({
        type: "part", n, title,
        duration: f.replace(/[()]/g, "").trim(),
        hall,
        assign: [cellTxt(cells, 7), cellTxt(cells, 8)].filter(Boolean).join(" / ")
      });
      continue;
    }

    // Pangwakas na Komento (no number) → chairman
    if (/pangwakas/i.test(c)) {
      cur.rows.push({ type: "part", title: c, duration: f.replace(/[()]/g, "").trim(), assign: "Chairman" });
      continue;
    }
  }
  if (cur && cur.dateLabel) meetings.push(cur);

  // Tag each row with its section (1/2/3) and sort key
  for (const m of meetings) {
    let section = 0;
    for (const r of m.rows) {
      if (r.type === "part") section = r.n <= 3 ? 1 : (r.n <= 7 ? 2 : 3);
      r.section = section;
    }
  }
  meetings.sort((a, b) => a.date - b.date);
  return meetings;
}

/* ---------- Render ---------- */
function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

function renderAssign(r) {
  if (!r.assign && !r.hall) return "";
  let html = "";
  if (r.hall) html += `<div class="hall">${esc(r.hall)}</div>`;
  if (r.assign) html += `<div class="names${r.assign.toLowerCase() === "chairman" ? " plain" : ""}">${esc(r.assign)}</div>`;
  return html;
}

function renderMeeting(m) {
  let html = `
    <div class="masthead">
      <div class="congregation">${esc(CONGREGATION)}</div>
      <h1>Iskedyul ng Pulong sa Gitnang Sanlinggo</h1>
      <div style="width:120px"></div>
    </div>
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
      <div class="meeting-title">${esc(m.dateLabel)}${m.reading ? " &nbsp;|&nbsp; " + esc(m.reading) : ""}</div>
      <div class="officers" style="margin-bottom:0;">
        ${m.chairman ? `<div><span class="label">Chairman:</span><span class="name">${esc(m.chairman)}</span></div>` : ""}
        ${m.openingPrayer ? `<div><span class="label">Panalangin:</span><span class="name">${esc(m.openingPrayer)}</span></div>` : ""}
      </div>
    </div>
    <table class="schedule"><tbody>`;

  let lastSection = 0;
  for (const r of m.rows) {
    if (r.section !== lastSection) {
      const cls = r.section === 3 ? "section-maroon" : "section-olive";
      html += `<tr><td colspan="3" style="padding-top:12px;">
        <span class="section-bar ${cls}">${SECTION_NAMES[r.section]}</span></td></tr>`;
      lastSection = r.section;
    }
    const left = r.type === "song"
      ? `<span class="song item-text">Awit ${esc(r.n)}</span>`
      : `<span class="item-text">${r.n ? r.n + ". " : ""}${esc(r.title)}</span>${r.duration ? ` <span class="duration">(${esc(r.duration)})</span>` : ""}`;
    html += `<tr>
      <td class="time">0:00</td>
      <td class="item">${left}</td>
      <td class="assign">${renderAssign(r)}</td>
    </tr>`;
  }
  return html + `</tbody></table>`;
}

/* ---------- Wire-up ---------- */
let MEETINGS = [];

function setStatus(msg, isError = false) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = "status" + (isError ? " error" : "");
}

function pickDefaultWeek() {
  const today = new Date(); today.setHours(12, 0, 0, 0);
  // nearest meeting: prefer today or the next upcoming one
  let best = 0, bestDiff = Infinity;
  MEETINGS.forEach((m, i) => {
    const diff = m.date - today;
    const score = diff >= 0 ? diff : diff + 1e9;   // favor upcoming weeks
    if (score < bestDiff) { bestDiff = score; best = i; }
  });
  return best;
}

function showWeek(i) {
  const m = MEETINGS[+i];
  if (!m) return;
  document.getElementById("output").innerHTML = renderMeeting(m);
}

async function loadSheet() {
  const input = document.getElementById("sheetUrl").value.trim();
  const sheetId = extractSheetId(input);
  if (!sheetId) { setStatus("Walang wastong sheet ID o link.", true); return; }
  localStorage.setItem(STORAGE_KEY, input);
  setStatus("Kumukuha ng data mula sa Google Sheet…");
  try {
    const rows = await fetchSheetRows(sheetId);
    MEETINGS = parseMeetings(rows);
    if (!MEETINGS.length) throw new Error("Walang nahanap na meeting block sa sheet.");
    const picker = document.getElementById("weekPicker");
    picker.innerHTML = MEETINGS.map((m, i) => `<option value="${i}">${esc(m.dateLabel)}${m.reading ? " — " + esc(m.reading) : ""}</option>`).join("");
    picker.disabled = false;
    const idx = pickDefaultWeek();
    picker.value = String(idx);
    showWeek(idx);
    setStatus(`✓ Na-load ang ${MEETINGS.length} na linggo mula sa sheet.`);
  } catch (e) {
    setStatus("Hindi na-load ang sheet: " + e.message, true);
  }
}

document.getElementById("sheetUrl").value = localStorage.getItem(STORAGE_KEY) || DEFAULT_SHEET;
loadSheet();
</script>
</body>
</html>
