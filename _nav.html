<script>
    // Dark Mode - persists across pages
    (function() {
        const themeToggle = document.getElementById('theme-toggle');
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        const html = document.documentElement;

        // Restore saved theme or follow system
        const saved = localStorage.getItem('bacungan-theme');
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
        }

        function updateIcon() {
            const icon = themeToggle.querySelector('i');
            if (html.classList.contains('dark')) {
                icon.className = 'fa-solid fa-sun';
                localStorage.setItem('bacungan-theme', 'dark');
            } else {
                icon.className = 'fa-solid fa-moon';
                localStorage.setItem('bacungan-theme', 'light');
            }
        }

        themeToggle.addEventListener('click', () => {
            html.classList.toggle('dark');
            updateIcon();
        });
        updateIcon();

        // Mobile menu toggle
        mobileMenuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });

        // Close mobile menu when clicking a link
        mobileMenu.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                mobileMenu.classList.add('hidden');
            });
        });

        // Highlight current page in nav
        const currentPath = window.location.pathname.split('/').pop();
        document.querySelectorAll('.nav-link').forEach(link => {
            if (link.getAttribute('href') === currentPath) {
                link.classList.add('text-white', 'bg-slate-800');
                link.classList.remove('text-slate-300');
            }
        });
    })();
</script>
